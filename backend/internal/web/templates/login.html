<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Debian NAS (OpenZFS Storage)</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/alpine.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 50% 15%, #1a2230 0%, #11151c 50%, #0a0d12 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
      font-family: var(--omv-font-sans);
      color: #e5e7eb;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      animation: fadeIn 0.3s ease-out;
    }
    .login-card {
      background: #1c1c1e;
      border: 1px solid #323236;
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 2.25rem 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      width: 52px;
      height: 52px;
      color: #008be5;
      margin: 0 auto 0.75rem auto;
      filter: drop-shadow(0 2px 10px rgba(0, 139, 229, 0.4));
    }
    .login-title {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }
    .login-title strong {
      font-weight: 700;
      color: #008be5;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--omv-font-mono);
      font-size: 0.72rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #d1d5db;
      margin-bottom: 0.4rem;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 0.85rem;
      width: 16px;
      height: 16px;
      color: #6b7280;
      pointer-events: none;
    }
    .form-control {
      width: 100%;
      height: 40px;
      background: #141416;
      border: 1px solid #38383c;
      border-radius: 6px;
      padding: 0 2.5rem 0 2.5rem;
      font-size: 0.88rem;
      color: #ffffff;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: #008be5;
      box-shadow: 0 0 0 2px rgba(0, 139, 229, 0.25);
      background: #18181b;
    }
    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle-btn:hover {
      color: #ffffff;
    }
    .login-submit-btn {
      width: 100%;
      height: 42px;
      background: #008be5;
      border: 1px solid #0077c5;
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 2px 10px rgba(0, 139, 229, 0.35);
      margin-top: 1.5rem;
    }
    .login-submit-btn:hover {
      background: #0077c5;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 139, 229, 0.5);
    }
    .login-submit-btn:active {
      transform: translateY(0);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .hint-card {
      margin-top: 1.5rem;
      padding: 0.75rem 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2e2e32;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #9ca3af;
      line-height: 1.4;
    }
    .hint-card code {
      font-family: var(--omv-font-mono);
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 4px;
      border-radius: 3px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body x-data="{
  username: '',
  password: '',
  showPassword: false
}">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <svg class="login-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="3" width="20" height="18" rx="2"/>
          <line x1="6" y1="8" x2="18" y2="8"/>
          <line x1="6" y1="12" x2="18" y2="12"/>
          <line x1="6" y1="16" x2="18" y2="16"/>
          <circle cx="18" cy="8" r="0.8" fill="currentColor"/>
          <circle cx="18" cy="12" r="0.8" fill="currentColor"/>
          <circle cx="18" cy="16" r="0.8" fill="currentColor"/>
        </svg>
        <h1 class="login-title">debian<strong>nas</strong></h1>
        <p class="login-subtitle">Enterprise OpenZFS Storage Server</p>
        <div>
          <span class="host-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="8"/>
            </svg>
            {{if .System.Hostname}}{{.System.Hostname}}{{else}}debian-nas.local{{end}}
          </span>
        </div>
      </div>

      {{if .ErrorMessage}}
        <div class="alert-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <span>{{.ErrorMessage}}</span>
        </div>
      {{end}}

      <!-- Login Form -->
      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <input type="text" id="username" name="username" class="form-control" x-model="username" required autocomplete="username" placeholder="Username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <input :type="showPassword ? 'text' : 'password'" id="password" name="password" x-ref="pwInput" class="form-control" x-model="password" required autocomplete="current-password" placeholder="Password">
            <button type="button" class="password-toggle-btn" @click="showPassword = !showPassword" title="Toggle password visibility">
              <svg x-show="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg x-show="showPassword" x-cloak width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
          <label style="display: flex; align-items: center; gap: 0.45rem; font-size: 0.76rem; color: #9ca3af; cursor: pointer;">
            <input type="checkbox" name="remember" checked class="disk-checkbox" style="width: 14px; height: 14px;">
            <span>Remember session</span>
          </label>
        </div>

        <button type="submit" class="login-submit-btn">
          Sign In (Anmelden)
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="hint-card">
        <div style="font-weight: 600; color: #d1d5db; margin-bottom: 0.2rem;">Default Credentials:</div>
        <div>Username: <code>root</code> / <code>admin</code> (or your configured NAS user)</div>
        <div>Password: <code>openmediavault</code> (or any password in mock mode)</div>
      </div>
    </div>
  </div>
</body>
</html>
