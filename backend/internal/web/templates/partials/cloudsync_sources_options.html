{{if and (eq (len .Pools) 0) (eq (len .Datasets) 0)}}
  <option value="" disabled>-- No ZFS datasets available --</option>
{{else}}
  {{range $p := .Pools}}
    <option value="/mnt/{{$p.Name}}">/mnt/{{$p.Name}} (Pool Root)</option>
    <option value="/{{$p.Name}}">/{{$p.Name}} (Pool Root)</option>
  {{end}}
  {{range $ds := .Datasets}}
    {{if and (eq $ds.Type "filesystem") (contains $ds.Name "/")}}
      {{if $ds.Mountpoint}}
        <option value="{{$ds.Mountpoint}}">{{$ds.Mountpoint}}</option>
      {{end}}
      <option value="/mnt/{{$ds.Name}}">/mnt/{{$ds.Name}}</option>
      <option value="/{{$ds.Name}}">/{{$ds.Name}}</option>
    {{end}}
  {{end}}
{{end}}
