<div x-show="!shareCustomPathMode">
  <select id="share-dataset-select" style="width: 100%;" x-model="shareForm.path"
          @change="if (!isEditingShare && !shareForm.name && $event.target.value) {
                     const opt = $event.target.selectedOptions[0];
                     if (opt && opt.dataset.suggested) shareForm.name = opt.dataset.suggested;
                   }">
    <option value="" disabled>-- Select an available ZFS Dataset / Filesystem --</option>
    {{range $p := .Pools}}
      <option value="/mnt/{{$p.Name}}" data-suggested="{{$p.Name}}">/mnt/{{$p.Name}} (Pool Root - {{formatBytes $p.FreeBytes}} Free)</option>
      {{range $ds := $.Datasets}}
        {{if and (eq $ds.Pool $p.Name) (eq $ds.Type "filesystem") (ne $ds.Name $p.Name)}}
          <option value="{{if $ds.Mountpoint}}{{$ds.Mountpoint}}{{else}}/mnt/{{$ds.Name}}{{end}}" data-suggested="{{baseName $ds.Name}}">
            &nbsp;&nbsp;&#8627; {{$ds.Name}} ({{if $ds.Mountpoint}}{{$ds.Mountpoint}}{{else}}/mnt/{{$ds.Name}}{{end}} - {{formatBytes $ds.AvailBytes}} Free)
          </option>
        {{end}}
      {{end}}
    {{end}}
    {{if not .Pools}}
      {{range $ds := .Datasets}}
        {{if eq $ds.Type "filesystem"}}
          <option value="{{if $ds.Mountpoint}}{{$ds.Mountpoint}}{{else}}/mnt/{{$ds.Name}}{{end}}" data-suggested="{{baseName $ds.Name}}">
            {{$ds.Name}} ({{if $ds.Mountpoint}}{{$ds.Mountpoint}}{{else}}/mnt/{{$ds.Name}}{{end}} - {{formatBytes $ds.AvailBytes}} Free)
          </option>
        {{end}}
      {{end}}
    {{end}}
  </select>
</div>

<!-- Available Datasets Quick Selector Chips -->
<div style="margin-top: 0.5rem;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; gap: 0.5rem; flex-wrap: wrap;">
    <span class="text-dim" style="font-size: 0.72rem; font-weight: 500;">Detected ZFS Filesystems (click to select):</span>
    <span class="font-mono text-blue" style="font-size: 0.7rem;" x-text="shareForm.path ? ('Selected: ' + shareForm.path) : 'None selected'"></span>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 0.35rem; max-height: 90px; overflow-y: auto; padding: 0.4rem; background: rgba(15, 23, 42, 0.5); border-radius: 4px; border: 1px solid rgba(255,255,255,0.06);">
    {{range $ds := .Datasets}}
      {{if eq $ds.Type "filesystem"}}
      <button type="button"
              class="btn btn-secondary btn-sm"
              style="font-size: 0.72rem; padding: 0.2rem 0.55rem;"
              data-ds-path="{{if $ds.Mountpoint}}{{$ds.Mountpoint}}{{else}}/mnt/{{$ds.Name}}{{end}}"
              data-ds-name="{{baseName $ds.Name}}"
              :style="shareForm.path === $el.dataset.dsPath ? 'border-color: #008be5; background: rgba(0,139,229,0.2); color: #ffffff;' : ''"
              @click="shareForm.path = $el.dataset.dsPath; shareCustomPathMode = false; if (!isEditingShare && !shareForm.name) { shareForm.name = $el.dataset.dsName; }">
        <span>{{$ds.Name}}</span> <span class="text-dim">({{formatBytes $ds.AvailBytes}})</span>
      </button>
      {{end}}
    {{else}}
      <span class="text-dim" style="font-size: 0.72rem; font-style: italic;">No ZFS datasets detected yet. Create a Storage Pool or Dataset first, or enter a custom path.</span>
    {{end}}
  </div>
</div>
