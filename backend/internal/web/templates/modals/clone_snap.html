<div class="modal-backdrop" x-show="openCloneSnapModal" x-cloak>
  <div class="modal-box" @click.outside="openCloneSnapModal = false">
    <div class="modal-header">
      <h3>Snapshot klonen</h3>
      <button type="button" class="modal-close" @click="openCloneSnapModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/snapshots/clone" hx-target="#datasets-container" hx-swap="morph" @htmx:after-request="if (event.detail.successful) openCloneSnapModal = false">
      <div class="form-group">
        <label>Quell-Snapshot</label>
        <input type="text" name="snapshot" :value="cloneSnapSource" readonly class="font-mono" style="background: rgba(15,23,42,0.6);">
      </div>

      <div class="form-group">
        <label>Neues Dataset / Klon-Pfad</label>
        <input type="text" name="target_dataset" required placeholder="z.B. tank/mein-klon" pattern="[a-zA-Z0-9_\-\./]+">
        <span class="text-dim" style="font-size: 0.72rem;">Erstellt ein vollwertig beschreibbares ZFS Filesystem basierend auf dem Snapshot.</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCloneSnapModal = false">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Klon erstellen</button>
      </div>
    </form>
  </div>
</div>
