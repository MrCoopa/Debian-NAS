<div class="modal-backdrop" x-show="openCloneSnapModal" x-cloak>
  <div class="modal-box" @click.outside="openCloneSnapModal = false">
    <div class="modal-header">
      <h3>Clone Snapshot</h3>
      <button type="button" class="modal-close" @click="openCloneSnapModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/snapshots/clone" hx-target="#datasets-container" hx-swap="morph" @htmx:after-request="if (event.detail.successful) openCloneSnapModal = false">
      <div class="form-group">
        <label>Source Snapshot</label>
        <input type="text" name="snapshot" :value="cloneSnapSource" readonly class="font-mono" style="background: rgba(15,23,42,0.6);">
      </div>

      <div class="form-group">
        <label>New Dataset / Clone Path</label>
        <input type="text" name="target_dataset" x-model="cloneSnapTarget" required placeholder="e.g. DATA/my-clone" pattern="[a-zA-Z0-9_.:/-]+" autocomplete="off">
        <span class="text-dim" style="font-size: 0.72rem;">Creates a writable ZFS dataset in the <strong>same pool</strong>, accessible under the Dataset tab.</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCloneSnapModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Clone</button>
      </div>
    </form>
  </div>
</div>
