<div class="modal-backdrop" x-show="openShareModal" x-cloak>
  <div class="modal-box" @click.outside="openShareModal = false">
    <div class="modal-header">
      <h3 x-text="isEditingShare ? ('Edit ' + (shareForm.proto === 'nfs' ? 'NFS Export: ' : 'SMB Share: ') + (shareForm.name || shareForm.path)) : 'Create Network File Share'"></h3>
      <button type="button" class="modal-close" @click="openShareModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/shares/save" hx-target="#shares-container" hx-swap="outerHTML"
          @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) { openShareModal = false; shareFormError = ''; } else if (res.hasError) { shareFormError = res.message; } }">
      <!-- Original identifier when renaming or updating path -->
      <input type="hidden" name="orig_name" :value="shareForm.origName || ''">
      <input type="hidden" name="orig_path" :value="shareForm.origPath || ''">
      <!-- Submit proto safely via hidden field when protocol dropdown is disabled during edit -->
      <input type="hidden" name="proto" :value="shareForm.proto">

      <div class="modal-inline-error" x-show="shareFormError" x-text="shareFormError" x-cloak></div>

      <!-- Share Name (SMB only) -->
      <div class="form-group" x-show="shareForm.proto === 'smb'">
        <label>Share Name</label>
        <input type="text" name="name" x-model="shareForm.name" :readonly="isEditingShare" :disabled="shareForm.proto !== 'smb'" placeholder="e.g. Media, Backups" :required="shareForm.proto === 'smb'">
      </div>
      <!-- For NFS, submit path as fallback name -->
      <input type="hidden" name="name" :value="shareForm.name || shareForm.path" :disabled="shareForm.proto === 'smb'">

      <!-- Dataset / Mountpoint Selector -->
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; gap: 0.5rem; flex-wrap: wrap;">
          <label style="margin: 0;">Dataset / Folder Path</label>
          <button type="button" @click="shareCustomPathMode = !shareCustomPathMode" style="background: none; border: none; color: #008be5; font-size: 0.72rem; cursor: pointer; text-decoration: underline;">
            <span x-text="shareCustomPathMode ? 'Pick from available Datasets' : 'Enter Custom Path'"></span>
          </button>
        </div>

        <!-- Dropdown + Quick Chips refreshed automatically on pool/dataset updates -->
        <div id="share-modal-datasets"
             hx-get="/ui/partials/modals/share_datasets"
             hx-trigger="poolUpdate from:body, datasetUpdate from:body"
             hx-target="this"
             hx-swap="innerHTML">
          {{template "partials/share_datasets_picker.html" .}}
        </div>

        <!-- Free-text Custom Path Input -->
        <div x-show="shareCustomPathMode" style="margin-top: 0.5rem;">
          <input type="text" x-model="shareForm.path" placeholder="e.g. /mnt/DATA/CustomFolder" style="width: 100%;">
        </div>

        <!-- Always bind the actual path value to name="path" for form submission -->
        <input type="hidden" name="path" :value="shareForm.path">
      </div>

      <div class="form-group">
        <label>Protocol</label>
        <select name="proto" x-model="shareForm.proto" :disabled="isEditingShare">
          <option value="smb">SMB / CIFS (Windows, macOS, Explorer)</option>
          <option value="nfs">NFS Export (Linux, Proxmox VE, Unix)</option>
        </select>
      </div>

      <!-- NFS Allowed Clients -->
      <div class="form-group" x-show="shareForm.proto === 'nfs'">
        <label>Allowed Client Network / IP (CIDR)</label>
        <input type="text" name="allowed_clients" x-model="shareForm.allowed_clients" placeholder="e.g. 192.168.1.0/24 or *">
        <span class="text-dim" style="font-size: 0.72rem;">Examples: <code>*</code> (all hosts), <code>192.168.1.0/24</code> (LAN subnet), or a specific IP.</span>
      </div>

      <div class="form-group">
        <label>Access Control Policy</label>
        <select name="access" x-model="shareForm.access">
          <option value="restricted">Authenticated Users (Read/Write)</option>
          <option value="readonly">Read-Only (Authenticated)</option>
          <option value="guest" x-show="shareForm.proto === 'smb'">Public / Guest Access (No password required)</option>
        </select>
      </div>

      <!-- Allowed Users checkboxes (only for authenticated SMB shares) -->
      <div class="form-group" x-show="shareForm.proto === 'smb' && shareForm.access !== 'guest'">
        <label>Allowed Users (Optional - Leave empty for all Storage Users)</label>
        <div id="share-modal-users"
             hx-get="/ui/partials/modals/share_users"
             hx-trigger="userUpdate from:body"
             hx-target="this"
             hx-swap="innerHTML"
             style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.4rem; background: rgba(15, 23, 42, 0.4); border: 1px solid var(--pf-border-color); padding: 0.6rem; border-radius: 4px; max-height: 110px; overflow-y: auto;">
          {{template "partials/share_users_checkboxes.html" .}}
        </div>
        <span class="text-dim" style="font-size: 0.7rem;">
          Select the users who should have access. If no users are selected, all NAS users (@nasusers) will have access.
        </span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openShareModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary" x-text="isEditingShare ? 'Update Share' : 'Save Share'"></button>
      </div>
    </form>
  </div>
</div>
