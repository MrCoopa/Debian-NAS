<div class="modal-backdrop" x-show="openDiskActionModal" x-cloak>
  <div class="modal-box" @click.outside="openDiskActionModal = false">
    <div class="modal-header">
      <h3 x-text="diskAction.type === 'replace' ? ('Replace Disk ' + diskAction.targetDevice + ' in ' + diskAction.pool) : ('Attach Mirror Disk to ' + diskAction.targetDevice + ' in ' + diskAction.pool)"></h3>
      <button type="button" class="modal-close" @click="openDiskActionModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/pools/disk/action"
          hx-target="#pools-container" hx-swap="outerHTML"
          @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) openDiskActionModal = false; }">
      <input type="hidden" name="action_type" :value="diskAction.type">
      <input type="hidden" name="pool" :value="diskAction.pool">
      <input type="hidden" name="target_device" :value="diskAction.targetDevice">
      <input type="hidden" name="existing_device" :value="diskAction.targetDevice">
      <input type="hidden" name="old_device" :value="diskAction.targetDevice">
      
      <div class="form-group">
        <label>Select New Replacement / Mirror Disk</label>
        <select name="new_device" required
                hx-get="/ui/partials/modals/available_disks"
                hx-trigger="poolUpdate from:body, diskUpdate from:body, refreshAvailableDisks from:body"
                hx-target="this"
                hx-swap="innerHTML">
          {{template "partials/available_disks_options.html" .}}
        </select>
        <small class="text-dim" style="font-size: 0.72rem; display: block; margin-top: 0.25rem;">
          The replacement disk capacity must be greater than or equal to the existing disk.
        </small>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openDiskActionModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary" x-text="diskAction.type === 'replace' ? 'Start Resilver & Replace' : 'Attach as Mirror'"></button>
      </div>
    </form>
  </div>
</div>
