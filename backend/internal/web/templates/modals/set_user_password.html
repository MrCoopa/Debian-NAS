<div class="modal-backdrop" x-show="openPasswordModal" x-cloak>
  <div class="modal-box" @click.outside="openPasswordModal = false">
    <div class="modal-header">
      <h3>Set Password for User: <span class="text-blue" x-text="passwordUser"></span></h3>
      <button type="button" class="modal-close" @click="openPasswordModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/shares/users/password" hx-target="#users-container" hx-swap="outerHTML"
          @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) { openPasswordModal = false; $el.reset(); } }">
      <input type="hidden" name="username" :value="passwordUser">
      <div class="form-group">
        <label>New Password (Samba / Storage)</label>
        <input type="password" name="password" placeholder="••••••••" required minlength="4">
        <small class="text-dim" style="font-size: 0.72rem; display: block; margin-top: 0.25rem;">
          Updates the password in the Samba database so Windows / macOS / Linux clients can connect.
        </small>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openPasswordModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>
  </div>
</div>
