<div class="modal-backdrop" x-show="openCreatePoolModal" x-cloak>
  <div class="modal-box" @click.outside="openCreatePoolModal = false">
    <div class="modal-header">
      <h3>Create OpenZFS Storage Pool</h3>
      <button type="button" class="modal-close" @click="openCreatePoolModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/pools/create" hx-target="#pools-container" hx-swap="morph" @htmx:after-request="if (event.target === $el && event.detail.successful) openCreatePoolModal = false">
      <div class="form-group">
        <label>Pool Name</label>
        <input type="text" name="name" placeholder="e.g. DATA, TANK, POOL-NVME" required pattern="^[A-Za-z][A-Za-z0-9_.-]{0,63}$">
      </div>
      <div class="form-group">
        <label>VDEV Redundancy Layout</label>
        <select name="vdev_type">
          <option value="mirror">Mirror (2+ Disks - High IOPS &amp; Redundancy)</option>
          <option value="raidz1">RAID-Z1 (3+ Disks - 1 Parity Disk)</option>
          <option value="raidz2">RAID-Z2 (4+ Disks - 2 Parity Disks - Recommended)</option>
          <option value="raidz3">RAID-Z3 (5+ Disks - 3 Parity Disks)</option>
          <option value="stripe">Single / Stripe (1+ Disks - No Redundancy)</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group col-6">
          <label>Sector Alignment (ashift)</label>
          <select name="ashift">
            <option value="12" selected>12 (4 KiB Sectors - Standard HDD/SSD)</option>
            <option value="13">13 (8 KiB Sectors - Enterprise NVMe)</option>
            <option value="9">9 (512B Legacy Sectors)</option>
          </select>
        </div>
        <div class="form-group col-6">
          <label>Default Compression</label>
          <select name="compression">
            <option value="lz4" selected>lz4 (Fast &amp; Recommended)</option>
            <option value="zstd">zstd (High Ratio)</option>
            <option value="gzip">gzip (Archival)</option>
            <option value="off">off (Disabled)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Member Drives (Physical Disks)</label>
        <div id="create-pool-disks-list" hx-get="/ui/partials/modals/pool_disks" hx-trigger="poolUpdate from:body, diskUpdate from:body, refreshCreatePoolDisks from:body" hx-target="this" hx-swap="innerHTML" style="background: rgba(15,23,42,0.6); border: 1px solid var(--pf-border-color); border-radius: 4px; padding: 0.6rem; max-height: 150px; overflow-y: auto;">
          {{template "partials/pool_disks_checkboxes.html" .}}
        </div>
        <small class="text-dim" style="font-size: 0.72rem; display: block; margin-top: 0.25rem;">
          The appliance automatically uses persistent /dev/disk/by-id/ paths for maximum reliability.
        </small>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCreatePoolModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Storage Pool</button>
      </div>
    </form>
  </div>
</div>
