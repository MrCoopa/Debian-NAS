<div class="modal-backdrop" x-show="openPoolPropsModal" x-cloak>
  <div class="modal-box" @click.outside="openPoolPropsModal = false">
    <div class="modal-header">
      <h3>Pool Properties: <span class="text-blue font-mono" x-text="poolProps.pool"></span></h3>
      <button type="button" class="modal-close" @click="openPoolPropsModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/pools/property" hx-target="#pools-container" hx-swap="outerHTML" @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) openPoolPropsModal = false; }">
      <input type="hidden" name="pool" :value="poolProps.pool">

      <div class="form-group">
        <label>Automatic TRIM (autotrim)</label>
        <select name="autotrim" x-model="poolProps.autotrim">
          <option value="on">on (Background deallocation of unused SSD blocks)</option>
          <option value="off">off (Default for HDDs or manual TRIM schedules)</option>
        </select>
        <span class="text-dim" style="font-size: 0.72rem;">Recommended for all-flash SSD / NVMe pools.</span>
      </div>

      <div class="form-group">
        <label>Automatic Pool Expansion (autoexpand)</label>
        <select name="autoexpand" x-model="poolProps.autoexpand">
          <option value="on">on (Pool capacity expands automatically when larger disks are installed)</option>
          <option value="off">off (Manual expansion required)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Failure Mode (failmode)</label>
        <select name="failmode" x-model="poolProps.failmode">
          <option value="continue">continue (Recommended for sleeping HDDs: retries I/O and NEVER suspends pool on spinup delay)</option>
          <option value="wait">wait (Default: Halts all I/O and suspends pool until 'zpool clear' is run)</option>
          <option value="panic">panic (Kernel panic on pool error)</option>
        </select>
        <span class="text-dim" style="font-size: 0.72rem;">Set to 'continue' to prevent pools with sleeping mechanical HDDs from freezing in SUSPENDED state when spinning up.</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openPoolPropsModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Properties</button>
      </div>
    </form>
  </div>
</div>
