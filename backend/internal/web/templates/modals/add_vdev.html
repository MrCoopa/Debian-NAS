<div class="modal-backdrop" x-show="openAddVdevModal" x-cloak>
  <div class="modal-box" @click.outside="openAddVdevModal = false">
    <div class="modal-header">
      <h3>Add VDEV / Expand Pool: <span class="text-blue font-mono" x-text="addVdevPool"></span></h3>
      <button type="button" class="modal-close" @click="openAddVdevModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/pools/vdev" hx-target="#pools-container" hx-swap="outerHTML" @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) openAddVdevModal = false; }">
      <input type="hidden" name="pool" :value="addVdevPool">
      <div class="form-group">
        <label>VDEV Role / Type</label>
        <select name="vdev_type">
          <option value="mirror">Data Mirror (Additional capacity with redundancy)</option>
          <option value="stripe">Data Stripe (Capacity extension)</option>
          <option value="cache">Cache (L2ARC SSD read cache)</option>
          <option value="log">Log (SLOG / ZIL SSD write acceleration)</option>
          <option value="special">Special (Fast SSDs for metadata &amp; small files)</option>
          <option value="spare">Hot Spare (Automated replacement on disk failure)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Disks to Add</label>
        <div id="add-vdev-disks-list" hx-get="/ui/partials/modals/pool_disks" hx-trigger="poolUpdate from:body, diskUpdate from:body, refreshAddVdevDisks from:body" hx-target="this" hx-swap="innerHTML" style="background: rgba(15,23,42,0.6); border: 1px solid var(--pf-border-color); border-radius: 4px; padding: 0.6rem; max-height: 140px; overflow-y: auto;">
          {{template "partials/pool_disks_checkboxes.html" .}}
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openAddVdevModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Add VDEV</button>
      </div>
    </form>
  </div>
</div>
