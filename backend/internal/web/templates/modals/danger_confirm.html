<div class="modal-backdrop" x-show="openDangerConfirmModal" x-cloak>
  <div class="modal-box" @click.outside="openDangerConfirmModal = false" style="border-top: 4px solid var(--pf-red);">
    <div class="modal-header">
      <h3 style="color: var(--pf-red);">
        <span>⚠️ Confirm Irrevocable Destruction: </span>
        <span class="font-mono text-red" x-text="dangerConfirm.targetName"></span>
      </h3>
      <button type="button" class="modal-close" @click="openDangerConfirmModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/destroy" hx-target="#pools-container" hx-swap="morph"
          @htmx:before-request="dangerConfirm.error = ''"
          @htmx:after-request="handleDangerDestroyResult($event)">
      <input type="hidden" name="type" :value="dangerConfirm.type">
      <input type="hidden" name="name" :value="dangerConfirm.targetName">

      <div x-show="dangerConfirm.error" x-cloak
           style="margin-bottom: 1rem; padding: 0.65rem 0.85rem; border-radius: 6px; border: 1px solid var(--pf-red); background: rgba(239, 68, 68, 0.12); color: #fecaca; font-size: 0.82rem; word-break: break-word;"
           x-text="dangerConfirm.error"></div>

      <p style="font-size: 0.85rem; color: var(--pf-text-secondary); margin-bottom: 1rem;">
        This action irrevocably destroys <strong x-text="dangerConfirm.type === 'pool' ? 'the entire ZFS storage pool' : 'the ZFS dataset'"></strong> and <strong>all contained files, directories, and snapshots</strong>.
      </p>

      <div class="form-group">
        <label>
          Type the exact name to confirm: <strong class="text-red font-mono" x-text="dangerConfirm.targetName"></strong>
        </label>
        <input type="text" x-model="dangerConfirm.inputName" :placeholder="'Type ' + (dangerConfirm.targetName || '')" class="font-mono" autocomplete="off">
      </div>

      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.82rem;">
          <input type="checkbox" name="delete_shares" value="true" checked>
          <span>Automatically remove all associated SMB and NFS shares</span>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openDangerConfirmModal = false">Cancel</button>
        <button type="submit" class="btn btn-danger" :disabled="(dangerConfirm.inputName || '').trim() !== (dangerConfirm.targetName || '')">
          Permanently Destroy
        </button>
      </div>
    </form>
  </div>
</div>
