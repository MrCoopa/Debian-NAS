<div class="modal-backdrop" x-show="openDangerConfirmModal" x-cloak>
  <div class="modal-box" @click.outside="openDangerConfirmModal = false" style="border-top: 4px solid var(--pf-red);">
    <div class="modal-header">
      <h3 style="color: var(--pf-red);">
        <span>⚠️ Unwiderrufliche Zerstörung bestätigen: </span>
        <span class="font-mono text-red" x-text="dangerConfirm.targetName"></span>
      </h3>
      <button type="button" class="modal-close" @click="openDangerConfirmModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/destroy" hx-target="#pools-container" hx-swap="morph" @htmx:after-request="if (event.detail.successful) openDangerConfirmModal = false">
      <input type="hidden" name="type" :value="dangerConfirm.type">
      <input type="hidden" name="name" :value="dangerConfirm.targetName">

      <p style="font-size: 0.85rem; color: var(--pf-text-secondary); margin-bottom: 1rem;">
        Diese Aktion löscht <strong x-text="dangerConfirm.type === 'pool' ? 'den gesamten ZFS Pool' : 'das ZFS Dataset'"></strong> und <strong>alle darin enthaltenen Dateien, Verzeichnisse und Snapshots unwiederbringlich</strong>.
      </p>

      <div class="form-group">
        <label>
          Tippe zur Bestätigung den genauen Namen ein: <strong class="text-red font-mono" x-text="dangerConfirm.targetName"></strong>
        </label>
        <input type="text" x-model="dangerConfirm.inputName" placeholder="Exakter Name zur Freigabe" class="font-mono" autocomplete="off">
      </div>

      <div class="form-group">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.82rem;">
          <input type="checkbox" name="delete_shares" value="true" checked>
          <span>Automatisch alle zugehörigen SMB- und NFS-Freigaben entfernen</span>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openDangerConfirmModal = false">Abbrechen</button>
        <button type="submit" class="btn btn-danger" :disabled="dangerConfirm.inputName !== dangerConfirm.targetName">
          Endgültig zerstören
        </button>
      </div>
    </form>
  </div>
</div>
