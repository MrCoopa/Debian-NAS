<div class="modal-backdrop" x-show="openCreateDatasetModal" x-cloak>
  <div class="modal-box" @click.outside="openCreateDatasetModal = false">
    <div class="modal-header">
      <h3>Neues ZFS Dataset erstellen</h3>
      <button type="button" class="modal-close" @click="openCreateDatasetModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/datasets" hx-target="#datasets-container" hx-swap="morph" @htmx:after-request="if (event.detail.successful) openCreateDatasetModal = false">
      <div class="form-group">
        <label>Übergeordneter Pool / Dataset</label>
        <select name="parent" required>
          {{range $p := .Pools}}
            <option value="{{$p.Name}}">{{$p.Name}} (Root Pool)</option>
          {{end}}
          {{range $ds := .Datasets}}
            {{if eq $ds.Type "filesystem"}}
              <option value="{{$ds.Name}}">{{$ds.Name}}</option>
            {{end}}
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label>Dataset Name (ohne Leerzeichen)</label>
        <input type="text" name="name" required placeholder="z.B. media, backup, documents" pattern="[a-zA-Z0-9_\-\.]+">
        <span class="text-dim" style="font-size: 0.72rem;">Wird unter &lt;Parent&gt;/&lt;Name&gt; eingehängt.</span>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label>Kompression</label>
          <select name="compression">
            <option value="lz4" selected>lz4 (Schnell &amp; empfohlen)</option>
            <option value="zstd">zstd (Höhere Kompressionsrate)</option>
            <option value="gzip">gzip (Archivierung)</option>
            <option value="off">Deaktiviert (off)</option>
          </select>
        </div>
        <div class="form-group col-6">
          <label>Recordsize</label>
          <select name="recordsize">
            <option value="128K" selected>128 KiB (Standard / Allround)</option>
            <option value="1M">1 MiB (Große Medien / Videostreaming)</option>
            <option value="64K">64 KiB</option>
            <option value="16K">16 KiB (Datenbanken / VM Images)</option>
            <option value="4K">4 KiB</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label>Speicherplatz-Limit (Quota)</label>
          <input type="text" name="quota" placeholder="z.B. 500G oder none" value="none">
        </div>
        <div class="form-group col-6">
          <label>Zugriffszeit (Atime)</label>
          <select name="atime">
            <option value="off" selected>off (HDD/SSD schont Schreibzugriffe)</option>
            <option value="on">on</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCreateDatasetModal = false">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Dataset erstellen</button>
      </div>
    </form>
  </div>
</div>
