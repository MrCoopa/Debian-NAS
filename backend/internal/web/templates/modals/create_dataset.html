<div class="modal-backdrop" x-show="openCreateDatasetModal" x-cloak>
  <div class="modal-box" @click.outside="openCreateDatasetModal = false">
    <div class="modal-header">
      <h3>Create New ZFS Dataset</h3>
      <button type="button" class="modal-close" @click="openCreateDatasetModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/datasets" hx-target="#datasets-container" hx-swap="outerHTML" @htmx:after-request="if (event.target === $el) { const res = window.nasTriggerHasError ? window.nasTriggerHasError(event.detail.xhr) : { hasError: false }; if (event.detail.successful && !res.hasError) { openCreateDatasetModal = false; $el.reset(); } }">
      <div class="form-group">
        <label>Parent Pool / Dataset</label>
        <div x-show="datasetParent">
          <input type="text" name="parent" :value="datasetParent" :disabled="!datasetParent" readonly class="font-mono" style="background: rgba(15,23,42,0.6);">
        </div>
        <div x-show="!datasetParent">
          <select name="parent" :disabled="!!datasetParent" :required="!datasetParent"
                  hx-get="/ui/partials/modals/parent_datasets"
                  hx-trigger="poolUpdate from:body, datasetUpdate from:body"
                  hx-target="this"
                  hx-swap="innerHTML">
            {{template "partials/parent_datasets_options.html" .}}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Dataset Name (No spaces)</label>
        <input type="text" name="name" required placeholder="e.g. media, backup, documents" pattern="[a-zA-Z0-9_\-\.]+">
        <span class="text-dim" style="font-size: 0.72rem;">Will be mounted at &lt;Parent&gt;/&lt;Name&gt;.</span>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label>Compression</label>
          <select name="compression">
            <option value="lz4" selected>lz4 (Fast &amp; Recommended)</option>
            <option value="zstd">zstd (Higher Compression Ratio)</option>
            <option value="gzip">gzip (Archival)</option>
            <option value="off">Disabled (off)</option>
          </select>
        </div>
        <div class="form-group col-6">
          <label>Record Size</label>
          <select name="recordsize">
            <option value="128K" selected>128 KiB (Default / All-Round)</option>
            <option value="1M">1 MiB (Large Media / Video Streaming)</option>
            <option value="64K">64 KiB</option>
            <option value="16K">16 KiB (Databases / VM Images)</option>
            <option value="4K">4 KiB</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label>Space Limit (Quota)</label>
          <input type="text" name="quota" placeholder="e.g. 500G or none" value="none">
        </div>
        <div class="form-group col-6">
          <label>Access Time (Atime)</label>
          <select name="atime">
            <option value="off" selected>off (Reduces write overhead)</option>
            <option value="on">on</option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCreateDatasetModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Dataset</button>
      </div>
    </form>
  </div>
</div>
