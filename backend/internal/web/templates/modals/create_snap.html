<div class="modal-backdrop" x-show="openCreateSnapModal" x-cloak>
  <div class="modal-box" @click.outside="openCreateSnapModal = false">
    <div class="modal-header">
      <h3>Create Manual ZFS Snapshot</h3>
      <button type="button" class="modal-close" @click="openCreateSnapModal = false">&times;</button>
    </div>
    <form hx-post="/ui/actions/zfs/snapshots" hx-target="#snapshots-container" hx-swap="morph" @htmx:after-request="if (event.detail.successful) openCreateSnapModal = false">
      <div class="form-group">
        <label>Target Dataset</label>
        <template x-if="snapDataset">
          <input type="text" name="dataset" :value="snapDataset" readonly class="font-mono" style="background: rgba(15,23,42,0.6);">
        </template>
        <template x-if="!snapDataset">
          <select name="dataset" required>
            {{range $p := .Pools}}
              <option value="{{$p.Name}}">{{$p.Name}} (Root Pool)</option>
            {{end}}
            {{range $ds := .Datasets}}
              <option value="{{$ds.Name}}">{{$ds.Name}}</option>
            {{end}}
          </select>
        </template>
      </div>

      <div class="form-group">
        <label>Snapshot Name (Without @)</label>
        <input type="text" name="snapshot_name" required placeholder="e.g. manual-backup, pre-upgrade" pattern="[a-zA-Z0-9_\-\.]+">
        <span class="text-dim" style="font-size: 0.72rem;">Saved as <code>&lt;dataset&gt;@&lt;snapshot_name&gt;</code>. Snapshots are immutable (read-only) and consume space only when data diverges.</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" @click="openCreateSnapModal = false">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Snapshot</button>
      </div>
    </form>
  </div>
</div>
